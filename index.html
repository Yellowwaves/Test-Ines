<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pour toi ❤️</title>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];

OneSignalDeferred.push(async function(OneSignal) {

    await OneSignal.init({
        appId: "6629cea5-ab9d-4d25-86f3-6d2d33957a0c"
    });

    console.log("Permission:",
        OneSignal.Notifications.permission);

    console.log("Subscription:",
        OneSignal.User.PushSubscription.id);

    console.log("OptedIn:",
        OneSignal.User.PushSubscription.optedIn);

    console.log("OneSignal ID:",
        OneSignal.User.onesignalId);
});
</script>
    <style>
        :root {
            --rose-1: #ff8fab;
            --rose-2: #ff5d8f;
            --rose-3: #ffd6e6;
            --blanc: #fffafc;
            --text: #4f2a3d;
            --violet: #7a5cff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.9), transparent 35%),
                linear-gradient(135deg, #fff3f7 0%, #ffe4ee 30%, #f9d5ff 100%);
            color: var(--text);
            overflow: hidden;
        }

        .bg-hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: clamp(1.2rem, 2vw, 2rem);
            opacity: 0.5;
            animation: floatUp 12s linear infinite;
        }

        .heart:nth-child(1) { left: 10%; bottom: -10%; animation-delay: 0s; }
        .heart:nth-child(2) { left: 25%; bottom: -15%; animation-delay: 1.8s; }
        .heart:nth-child(3) { left: 40%; bottom: -20%; animation-delay: 3.4s; }
        .heart:nth-child(4) { left: 58%; bottom: -12%; animation-delay: 5s; }
        .heart:nth-child(5) { left: 75%; bottom: -18%; animation-delay: 6.6s; }
        .heart:nth-child(6) { left: 88%; bottom: -14%; animation-delay: 8s; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.9) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.7; }
            100% {
                transform: translateY(-110vh) scale(1.2) rotate(15deg);
                opacity: 0;
            }
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(92vw, 560px);
            padding: 2.5rem 2rem;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 30px 80px rgba(172, 90, 140, 0.2);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            background: rgba(255, 143, 171, 0.14);
            border: 1px solid rgba(255, 93, 143, 0.25);
            color: var(--rose-2);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        h1 {
            margin: 1.2rem 0 0.7rem;
            font-size: clamp(2.2rem, 5vw, 4rem);
            line-height: 1.1;
            letter-spacing: -0.04em;
            color: var(--text);
        }

        .title-gradient {
            background: linear-gradient(135deg, var(--rose-2), #ff8d5c, var(--violet));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p {
            margin: 0;
            font-size: 1.08rem;
            line-height: 1.7;
            color: rgba(79, 42, 61, 0.85);
        }

        .actions {
            margin-top: 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            align-items: center;
        }

        .btn {
            width: 100%;
            max-width: 300px;
            border: none;
            border-radius: 999px;
            padding: 0.95rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--rose-1), var(--rose-2));
            color: white;
            box-shadow: 0 18px 30px rgba(255, 93, 143, 0.32);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.6);
            color: var(--text);
            border: 1px solid rgba(122, 92, 255, 0.2);
        }

        .footer-note {
            margin-top: 1.3rem;
            font-size: 0.9rem;
            color: rgba(79, 42, 61, 0.65);
        }

        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.3rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-hearts" aria-hidden="true">
        <span class="heart">💖</span>
        <span class="heart">💗</span>
        <span class="heart">💞</span>
        <span class="heart">💘</span>
        <span class="heart">💝</span>
        <span class="heart">💖</span>
    </div>

    <main class="card">
        <h1><span class="title-gradient">Coucou mon amour</span></h1>
        <p>
            Voici un petit site qui a été fait rien que pour toi. J’espère qu’il te fera sourire.💖
        </p>

        <div class="actions">
            <button class="btn btn-primary" type="button">Autoriser les notifications</button>
            <button class="btn btn-secondary" type="button">Je t’aime fort</button>
        </div>
    </main>

    <script>
        document.querySelector('.btn-primary').addEventListener('click', function () {
            this.textContent = 'Notifications activées ✨';
            this.disabled = true;
            this.style.opacity = '0.9';
        });

        document.querySelector('.btn-secondary').addEventListener('click', function () {
            this.textContent = 'Toujours ❤️';
        });
    </script>
</body>
</html>
